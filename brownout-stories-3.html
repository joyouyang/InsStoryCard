<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brownout Stories III</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
/* Layout: phone on the left running a story viewer; a notes column on the right follows the current story.
   On a phone the viewer fills the screen and the notes open as a sheet. */
:root{
  --bg:#f2ede6;            /* warm putty, pulled from the blanket */
  --fg:#241c15;
  --muted:#6f6257;
  --line:#dcd2c6;
  --card:#fbf8f4;
  --accent:#8a5a2b;        /* blanket brown */
  --accent-ink:#ffffff;
  --phone:#0b0a09;
  --display:"Fraunces", Georgia, "Songti SC", serif;
  --body:-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Noto Sans SC", sans-serif;
  --hand:"Caveat", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130f; --fg:#efe7dd; --muted:#a79886; --line:#332a22; --card:#211b16; --accent:#d7a86e; --accent-ink:#1a120a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17130f; --fg:#efe7dd; --muted:#a79886; --line:#332a22; --card:#211b16; --accent:#d7a86e; --accent-ink:#1a120a; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}

.app{
  min-height:100%;
  display:grid;
  grid-template-columns:minmax(0,420px) minmax(0,1fr);
  gap:32px;
  padding-block:28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  max-width:1120px;
  margin:0 auto;
  align-items:start;
}
.phone-col{position:sticky;top:20px;display:flex;justify-content:center}

/* ---------- phone ---------- */
.phone-fit{width:393px;max-width:100%;height:852px}
.phone{
  width:393px;height:852px;transform-origin:top left;
  background:var(--phone);
  border-radius:54px;
  padding:12px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.45), 0 0 0 1.5px #2b2623 inset, 0 0 0 4px #141110;
  position:relative;
  user-select:none;
  -webkit-user-select:none;
}
.screen{
  position:absolute;inset:12px;border-radius:44px;overflow:hidden;background:#000;color:#fff;
  font-family:var(--body);
  touch-action:manipulation;
}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px;z-index:40}
.statusbar{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 30px;font-size:15px;font-weight:600;z-index:39;letter-spacing:.2px;pointer-events:none}
.statusbar .icons{display:flex;gap:5px;align-items:center}
.statusbar svg{display:block}

.stage{position:absolute;inset:0;overflow:hidden;background:#111}
.story{position:absolute;inset:0;display:none;overflow:hidden}
.story.active{display:block}

/* progress + header */
.topchrome{position:absolute;left:0;right:0;top:0;z-index:30;padding:58px 10px 0;pointer-events:none;
  background:linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0) 100%);height:150px}
.bars{display:flex;gap:3px}
.bar{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.bar.done i{width:100%}
.hdr{display:flex;align-items:center;gap:10px;margin-top:12px;pointer-events:auto}
.hdr .av{width:34px;height:34px;border-radius:50%;background:#fff url(assets/s1.jpg) center/cover;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.hdr .name{font-weight:600;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.hdr .time{opacity:.75;font-size:14px;margin-left:2px}
.hdr .spacer{flex:1}
.hdr .x{opacity:.95;font-size:22px;font-weight:300;line-height:1;padding:4px 6px}
.hdr .dots{letter-spacing:1px;padding:4px 6px}
.hdr .ctrl{background:none;border:0;cursor:pointer}

.bottomchrome{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:0 14px 30px;display:flex;gap:14px;align-items:center;
  background:linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0));padding-top:40px;pointer-events:none}
.reply{flex:1;border:1.5px solid rgba(255,255,255,.75);border-radius:26px;padding:12px 18px;font-size:15px;color:rgba(255,255,255,.9)}
.bottomchrome svg{flex:none}

.tapzone{position:absolute;top:0;bottom:90px;width:33%;z-index:10;cursor:pointer}
.tapzone.l{left:0}.tapzone.r{right:0;width:67%}
.paused .bar i{animation-play-state:paused}
.pausehint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:31;opacity:0;transition:opacity .2s;pointer-events:none;
  background:rgba(0,0,0,.45);border-radius:50%;width:54px;height:54px;display:grid;place-items:center}
.paused .pausehint{opacity:1}

/* ---------- Instagram sticker components ---------- */
.ig{position:absolute;z-index:20;font-family:var(--body)}
.ig-card{background:#fff;color:#111;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.ig-pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#111;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.ig-pill.dark{background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(8px)}
.ig-pill .grad{background:linear-gradient(90deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);-webkit-background-clip:text;background-clip:text;color:transparent}

/* poll */
.poll{width:250px;padding:16px 14px 12px;text-align:center}
.poll .q{font-weight:800;font-size:20px;margin-bottom:12px;letter-spacing:.3px}
.poll .opts{display:flex;border:1.5px solid #e2e2e2;border-radius:12px;overflow:hidden;position:relative}
.poll .opt{flex:1;padding:14px 0;font-size:30px;position:relative;cursor:pointer;background:none;border:0}
.poll .opt+.opt{border-left:1.5px solid #e2e2e2}
.poll .opt .pct{position:absolute;left:0;right:0;bottom:4px;font-size:11px;font-weight:700;color:#444;opacity:0;transition:opacity .3s}
.poll.voted .opt .pct{opacity:1}
.poll .opt .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#d9f3e6;z-index:-1;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.poll.voted .opt{z-index:0;isolation:isolate}
.poll .meta{font-size:11px;color:#888;margin-top:8px;font-weight:600}

/* music */
.music{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:14px}
.music .art{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#3d2e22,#9d7a56);display:grid;place-items:center;flex:none;overflow:hidden}
.music .art span{font-size:20px}
.music .t{font-weight:800;font-size:14px;line-height:1.1;white-space:nowrap}
.music .a{font-size:12px;color:#666;font-weight:600;margin-top:2px;white-space:nowrap}
.music .eq{display:flex;gap:2px;align-items:flex-end;height:16px;margin-left:6px}
.music .eq i{display:block;width:3px;background:#111;border-radius:2px;animation:eq 1s ease-in-out infinite}
.music .eq i:nth-child(2){animation-delay:.2s}.music .eq i:nth-child(3){animation-delay:.4s}.music .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}

/* emoji slider */
.slider{width:240px;padding:14px 16px 14px}
.slider .q{font-weight:800;font-size:16px;text-align:center;margin-bottom:12px}
.slider .track{height:8px;border-radius:8px;background:linear-gradient(90deg,#f9ce34,#ee2a7b,#6228d7);position:relative}
.slider .knob{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-size:34px;transition:left 1.4s cubic-bezier(.3,.9,.2,1.1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.slider .avg{font-size:11px;color:#888;margin-top:12px;text-align:center;font-weight:600}

/* polaroid frame (Frames sticker) */
.polaroid{background:#fff;padding:12px 12px 44px;box-shadow:0 14px 40px rgba(0,0,0,.45);position:relative}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#111}
.polaroid .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--hand);font-size:26px;color:#2a2521;font-weight:700}
.polaroid.undeveloped img{filter:brightness(.12) sepia(.6) contrast(1.2)}
.polaroid.developing img{animation:develop 2.4s ease-out forwards}
@keyframes develop{0%{filter:brightness(.12) sepia(.6) contrast(1.2)}60%{filter:brightness(.7) sepia(.3)}100%{filter:none}}
.shakehint{position:absolute;inset:0;display:grid;place-items:center;z-index:21;color:#fff;font-weight:700;font-size:15px;text-align:center;pointer-events:none}
.shakehint .ph{font-size:34px;animation:shake 1.4s ease-in-out infinite;display:block;margin-bottom:6px}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}

/* add yours */
.addyours{padding:6px 14px 6px 6px;gap:10px}
.addyours .stack{display:flex}
.addyours .stack i{width:30px;height:30px;border-radius:50%;background:#eee url(assets/photo_sq.jpg) center/cover;border:2px solid #fff;margin-right:-8px}
.addyours .stack i.plus{background:#111;color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px;font-weight:300}
.addyours .lbl{display:flex;flex-direction:column;line-height:1.1}
.addyours .lbl small{font-size:10px;color:#777;font-weight:700;letter-spacing:.3px}

/* reveal */
.reveal{width:230px;padding:18px 16px;text-align:center}
.reveal .eye{font-size:28px}
.reveal .t{font-weight:800;font-size:16px;margin-top:4px}
.reveal .s{font-size:12px;color:#777;margin-top:4px;font-weight:600}
.reveal button{margin-top:12px;background:#111;color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer}

/* gif stickers */
.gif{position:absolute;z-index:20;font-weight:900;font-family:var(--display);color:#fff;text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.4)}
.gif.q{font-size:64px;animation:bob 1.2s ease-in-out infinite}
.gif.q2{font-size:40px;animation:bob 1.2s ease-in-out .4s infinite reverse}
.gif.spark{font-size:30px;animation:twinkle 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(6deg)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}

/* sticker as a photo sticker (white border like IG photo stickers) */
.ps{position:absolute;z-index:20;background:#fff;padding:6px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.ps img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}

/* ---------- per-story scenes ---------- */
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.08)}

/* S2: Cookmoji screen recording */
.rec{position:absolute;inset:0;background:#0f0d0b;overflow:hidden}
.rec .topbar{display:none;position:absolute;top:64px;left:0;right:0;text-align:center;font-weight:700;font-size:15px;opacity:.9;color:#f2ece4}
.rec .photo{position:absolute;left:50%;top:150px;width:150px;aspect-ratio:9/16;transform:translateX(-50%);border-radius:14px;overflow:hidden;animation:recPhoto 9s linear infinite}
.rec .photo img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes recPhoto{0%{transform:translateX(-50%) scale(1);opacity:1;top:150px}18%{transform:translateX(-50%) scale(1);top:150px}30%{transform:translateX(-50%) scale(.45);top:76px;opacity:1}100%{transform:translateX(-50%) scale(.45);top:76px;opacity:1}}
.rec .scribble{position:absolute;left:50%;top:310px;transform:translateX(-50%);width:220px;height:220px;opacity:0;animation:recScribble 9s linear infinite}
@keyframes recScribble{0%,28%{opacity:0}32%{opacity:1}58%{opacity:1}62%{opacity:0}100%{opacity:0}}
.rec .scribble path{fill:none;stroke:#d7a86e;stroke-width:3;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 9s linear infinite}
@keyframes draw{0%,30%{stroke-dashoffset:1400}58%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.rec .out{position:absolute;left:50%;top:300px;width:230px;transform:translateX(-50%) scale(.2);opacity:0;animation:recOut 9s cubic-bezier(.2,.9,.3,1.2) infinite}
.rec .out img{width:100%;display:block;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
@keyframes recOut{0%,60%{opacity:0;transform:translateX(-50%) scale(.2)}66%{opacity:1;transform:translateX(-50%) scale(1.05)}70%{transform:translateX(-50%) scale(1)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.rec .more{position:absolute;left:50%;top:560px;transform:translateX(-50%);display:flex;gap:10px;opacity:0;animation:recMore 9s ease-out infinite}
.rec .more img{width:84px;border-radius:12px;display:block}
@keyframes recMore{0%,72%{opacity:0;transform:translateX(-50%) translateY(20px)}80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
.rec .status{position:absolute;left:0;right:0;top:126px;text-align:center;font-size:13px;color:#b9a994;font-weight:600;letter-spacing:.4px}
.rec .status span{position:absolute;left:0;right:0;opacity:0;animation:recStatus 9s linear infinite}
.rec .status span:nth-child(1){animation-delay:0s}.rec .status span:nth-child(2){animation-delay:3s}.rec .status span:nth-child(3){animation-delay:6s}
@keyframes recStatus{0%{opacity:0}5%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}

/* S3 layout */
.layout2{position:absolute;inset:0;display:grid;grid-template-rows:1fr 1fr;gap:3px;background:#fff}
.layout2 .cell{position:relative;overflow:hidden;background:#111}
.layout2 img{width:100%;height:100%;object-fit:cover;display:block}

/* S5 create mode */
.create{position:absolute;inset:0;background:linear-gradient(160deg,#e9c9a0 0%,#b98656 45%,#4a2f1b 100%)}

/* S6 chat */
.chat{position:absolute;inset:0;background:#fff;color:#111;display:flex;flex-direction:column}
.chat .ctop{height:118px;background:#f6f6f6;border-bottom:1px solid #ddd;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;flex-direction:column;align-items:center}
.chat .ctop .cav{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#9bb0c4,#5f7489);margin-bottom:4px}
.chat .ctop .cname{font-size:11px}
.chat .msgs{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.chat .m{max-width:72%;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.3}
.chat .in{background:#e9e9eb;align-self:flex-start;border-bottom-left-radius:5px}
.chat .out{background:#2d8cff;color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.chat .stk{align-self:flex-end;width:140px;border-radius:12px;display:block;background:none;padding:0}
.chat .stk img{width:100%;display:block;border-radius:12px}
.chat .read{font-size:11px;color:#8a8a8e;align-self:flex-end;margin-top:-2px;margin-right:4px}
.chat .cbar{height:92px;border-top:1px solid #ddd;background:#f6f6f6;display:flex;align-items:flex-start;padding:10px 12px;gap:10px}
.chat .cbar .inp{flex:1;border:1px solid #ccc;border-radius:18px;height:34px;background:#fff}
.chat .cbar .plus{width:34px;height:34px;border-radius:50%;background:#e2e2e4}
.chat .m,.chat .stk,.chat .read{opacity:0;animation:popin .4s ease-out forwards}
.chat .m:nth-child(1){animation-delay:.3s}.chat .stk:nth-child(2){animation-delay:1.4s}.chat .read:nth-child(3){animation-delay:1.9s}
.chat .m:nth-child(4){animation-delay:2.8s}.chat .stk:nth-child(5){animation-delay:4s}.chat .read:nth-child(6){animation-delay:4.5s}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

/* S8 reveal */
.blurbg{position:absolute;inset:-30px;background:url(assets/s5.jpg) center/cover;filter:blur(28px) saturate(1.2);transition:filter 1.2s ease}
.revealed .blurbg{filter:blur(0)}
.revealed .reveal{display:none}

/* S9 hands-free: slow drift as a stand-in for live video */
.hf{position:absolute;inset:0;overflow:hidden}
.hf img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;animation:drift 10s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-2.5%,1.5%) scale(1.06)}}
.live{position:absolute;z-index:12;top:150px;left:16px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;opacity:.9;color:#fff}
.live i{width:8px;height:8px;border-radius:50%;background:#ff3b30;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:.2}}

/* S10 share card */
.share{position:absolute;inset:0;background:#1d1510;overflow:hidden}
.share .grain{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(215,168,110,.28),transparent 60%)}
.share .orig{position:absolute;left:28px;top:170px;width:150px;aspect-ratio:9/16;border-radius:16px;overflow:hidden;transform:rotate(-5deg);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.share .orig img{width:100%;height:100%;object-fit:cover;display:block}
.share .arrow{position:absolute;left:170px;top:300px;width:70px;height:60px;transform:rotate(-10deg)}
.share .arrow path{fill:none;stroke:#d7a86e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.share .fan{position:absolute;right:16px;top:150px;width:200px;height:360px}
.share .fan .ps{width:150px;left:auto}
.share .fan .ps:nth-child(1){right:30px;top:0;transform:rotate(7deg)}
.share .fan .ps:nth-child(2){right:60px;top:130px;transform:rotate(-6deg)}
.share .fan .ps:nth-child(3){right:10px;top:255px;transform:rotate(4deg)}
.share .strip{position:absolute;left:0;right:0;bottom:200px;display:flex;justify-content:center;gap:8px}
.share .strip img{width:56px;border-radius:10px;opacity:.9}
.share .brand{position:absolute;left:0;right:0;bottom:155px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;color:#d7a86e;letter-spacing:.5px}

/* ---------- notes column ---------- */
.notes{min-width:0;display:flex;flex-direction:column;gap:18px}
.notes h1{font-family:var(--display);font-weight:500;font-size:clamp(26px,3vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.notes .lede{color:var(--muted);margin:6px 0 0;font-size:15px;line-height:1.55;max-width:60ch}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.list button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.list button .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);width:24px;flex:none}
.list button .lb{font-size:13px;line-height:1.25;min-width:0}
.list button .lb small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.list button[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;min-width:0}
.detail .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.detail h2{font-family:var(--display);font-weight:700;font-size:24px;margin:4px 0 12px;line-height:1.15}
.detail dl{display:grid;grid-template-columns:5.5em 1fr;gap:8px 14px;margin:0;font-size:14px;line-height:1.55}
.detail dt{color:var(--muted);font-weight:600}
.detail dd{margin:0;min-width:0}
.detail .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--bg)}
.chip.form{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.detail .why{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px;line-height:1.6;color:var(--fg)}
.foot{color:var(--muted);font-size:12px;line-height:1.6;max-width:62ch}
.foot code{font-size:12px}

.infobtn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;gap:16px;padding-block:12px}
  .phone-col{position:static}
  .notes h1{font-size:24px}
}
@media (prefers-reduced-motion: reduce){
  .rec *,.chat *,.hf img,.gif,.music .eq i,.shakehint .ph{animation-duration:.001s !important;animation-iteration-count:1 !important}
}

/* ---------- series II additions ---------- */
.hdr .av.photo{background-image:url(assets/photo_sq.jpg);background-position:50% 20%}

/* 1 · sticker pinned on the blanket */
.pin{position:absolute;z-index:20;background:#fff;padding:5px;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.45);animation:settle .9s cubic-bezier(.2,.9,.3,1.3) both}
.pin img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
@keyframes settle{from{transform:translate(-50%,-50%) scale(1.6) rotate(-14deg);opacity:0}to{opacity:1}}

/* 2 · create background with one sticker, avatar carries the photo */
.create2{position:absolute;inset:0;background:linear-gradient(170deg,#d9b98d 0%,#9c6f44 55%,#3f2816 100%)}
.hint-arrow{position:absolute;left:40px;top:110px;z-index:21;width:70px;height:70px}
.hint-arrow path{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}

/* 3 · in the mirror */
.mirror{position:absolute;z-index:20;overflow:hidden;border-radius:6px;box-shadow:0 0 0 3px rgba(190,230,255,.9),0 0 30px rgba(140,210,255,.8)}
.mirror img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(1.08)}
.mirror::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 45%)}

/* 4 · card flip video */
.flipstage{position:absolute;inset:0;background:#120e0b;display:grid;place-items:center;perspective:1200px}
.flipcard{width:250px;aspect-ratio:9/16;position:relative;transform-style:preserve-3d;animation:flip 8s cubic-bezier(.6,0,.3,1) infinite}
.flipcard .face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6);background:#fff}
.flipcard .face img{width:100%;height:100%;object-fit:cover;display:block}
.flipcard .back{transform:rotateY(180deg);display:grid;place-items:center;background:#fff}
.flipcard .back img{width:100%;height:auto;aspect-ratio:1;object-fit:cover}
@keyframes flip{0%,38%{transform:rotateY(0)}50%,88%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}

/* 5 · wipe before/after */
.wipe{position:absolute;inset:0;overflow:hidden;background:#111;touch-action:none}
.wipe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.wipe .after{clip-path:inset(0 0 0 var(--x,50%))}
.wipe .after img{object-fit:cover;object-position:50% 40%}
.wipe .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 12px rgba(0,0,0,.6)}
.wipe .knob{position:absolute;top:50%;left:var(--x,50%);transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4);font-size:18px;color:#111;font-weight:700}
.wipe.auto{animation:wipeauto 7s ease-in-out infinite alternate}
@keyframes wipeauto{0%{--x:12%}100%{--x:88%}}
@property --x{syntax:'<percentage>';inherits:true;initial-value:50%}

/* 6 · cutout */
.cut{position:absolute;z-index:20;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 14px 24px rgba(0,0,0,.45))}
.cut img{display:block;width:100%;height:auto;clip-path:polygon(40% 1%,60% 2%,74% 9%,76% 20%,72% 27%,84% 32%,100% 48%,100% 100%,0 100%,0 50%,10% 33%,18% 24%,14% 12%,24% 4%)}

/* 7 · drawn arrows */
.ink{position:absolute;inset:0;z-index:18;pointer-events:none}
.ink path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:ink 1.2s ease-out forwards}
.ink path:nth-child(2){animation-delay:.5s}.ink path:nth-child(3){animation-delay:1s}.ink path:nth-child(4){animation-delay:1.5s}
@keyframes ink{to{stroke-dashoffset:0}}
.mini{position:absolute;z-index:20;width:92px;background:#fff;padding:4px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;animation:popin .5s ease-out forwards}
.mini img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}

/* 8 · layout 2x2 */
.layout4{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#fff}
.layout4 .cell{position:relative;overflow:hidden;background:#111}
.layout4 img{width:100%;height:100%;object-fit:cover;display:block}

/* 9 · DM from the friend's phone */
.dm{position:absolute;inset:0;background:#fff;color:#111;display:flex;flex-direction:column;font-family:var(--body)}
.dm .dtop{height:112px;border-bottom:1px solid #e6e6e6;display:flex;align-items:flex-end;padding:0 14px 10px;gap:10px}
.dm .dtop .dav{width:36px;height:36px;border-radius:50%;background:url(assets/photo_sq.jpg) center 20%/cover}
.dm .dtop .dname{font-weight:700;font-size:15px;line-height:1.1}
.dm .dtop .dname small{display:block;font-weight:400;color:#777;font-size:11px}
.dm .dmsgs{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.dm .row{display:flex;align-items:flex-end;gap:8px;max-width:78%}
.dm .row.them{align-self:flex-start}
.dm .row.me{align-self:flex-end;flex-direction:row-reverse}
.dm .row .rav{width:24px;height:24px;border-radius:50%;background:url(assets/photo_sq.jpg) center 20%/cover;flex:none}
.dm .b{padding:9px 13px;border-radius:20px;font-size:15px;line-height:1.3;background:#efefef}
.dm .row.me .b{background:#3797f0;color:#fff}
.dm .row .sk{width:150px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dm .row .sk img{display:block;width:100%}
.dm .row{opacity:0;animation:popin .4s ease-out forwards}
.dm .row:nth-child(1){animation-delay:.3s}.dm .row:nth-child(2){animation-delay:1.3s}.dm .row:nth-child(3){animation-delay:2.4s}.dm .row:nth-child(4){animation-delay:3.4s}
.dm .dbar{height:92px;border-top:1px solid #e6e6e6;display:flex;align-items:flex-start;padding:10px 12px}
.dm .dbar .inp{flex:1;border:1px solid #ddd;border-radius:20px;height:40px}

/* 10 · share card B */
.share2{position:absolute;inset:0;background:#f3ebe0;overflow:hidden}
.share2 .big{position:absolute;left:0;right:0;top:0;height:68%;overflow:hidden}
.share2 .big img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.share2 .big::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(to top,#f3ebe0,transparent)}
.share2 .tear{position:absolute;left:0;right:0;top:60%;display:flex;justify-content:center;gap:10px;padding:0 18px}
.share2 .tear .ps{position:static;width:30%;padding:5px;border-radius:12px}
.share2 .tear .ps:nth-child(1){transform:rotate(-5deg) translateY(6px)}
.share2 .tear .ps:nth-child(3){transform:rotate(5deg) translateY(6px)}
.share2 .brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-family:var(--display);font-weight:700;font-size:22px;color:#6b4423;letter-spacing:.5px}

/* ---------- series III: tabs + lab ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lab{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:12px}
.lab h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.lab .row{display:grid;grid-template-columns:4.5em 1fr;gap:8px 12px;align-items:center;font-size:13px}
.lab .row > span{color:var(--muted);font-weight:600}
.lab .opts{display:flex;flex-wrap:wrap;gap:6px}
.lab .opts button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--fg)}
.lab .opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.lab .hintline{font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- A · flip lab ---------- */
.fstage{position:absolute;inset:0;background:#120e0b;display:grid;place-items:center;perspective:1100px;overflow:hidden}
.fstage .fcard{width:250px;aspect-ratio:9/16;position:relative;transform-style:preserve-3d;transition:transform var(--flip,.7s) cubic-bezier(.55,0,.25,1);will-change:transform}
.fstage.n9 .fcard,.fstage.n6 .fcard{width:300px}
.fstage .fcard.flipped{transform:rotateY(180deg)}
.fstage.axis-x .fcard.flipped{transform:rotateX(-180deg)}
.fstage .face{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6);background:#fff}
.fstage .face img{width:100%;height:100%;object-fit:cover;display:block}
.fstage .back{transform:rotateY(180deg);background:#f3ebe0;display:grid;place-items:center;padding:10px}
.fstage.axis-x .back{transform:rotateX(180deg)}
.fstage .grid{display:grid;gap:8px;width:100%}
.fstage .grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.fstage.n1 .grid{grid-template-columns:1fr;padding:6px}
.fstage.n4 .grid{grid-template-columns:1fr 1fr}
.fstage.n6 .grid{grid-template-columns:1fr 1fr 1fr}
.fstage.n9 .grid{grid-template-columns:1fr 1fr 1fr}
.fstage .grid img{opacity:0;transform:scale(.6)}
.fstage .fcard.flipped .grid img{animation:popcell .35s cubic-bezier(.2,.9,.3,1.4) forwards}
.fstage.sp-fast .fcard.flipped .grid img{animation-duration:.22s}
.fstage.sp-slow .fcard.flipped .grid img{animation-duration:.5s}
@keyframes popcell{to{opacity:1;transform:none}}
.fstage .fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.fstage .fxcard{position:absolute;inset:0;pointer-events:none;z-index:6;transform-style:preserve-3d}

/* fx 1 · 星尘 */
.fx-sparkle{background:radial-gradient(ellipse at 50% 55%,#2a1d12 0%,#120e0b 85%)}
.fx-sparkle.go .fcard .face{box-shadow:0 0 0 2px rgba(255,220,150,.9),0 0 60px rgba(255,200,110,.75),0 30px 60px rgba(0,0,0,.6)}
.star{position:absolute;left:50%;top:50%;width:14px;height:14px;background:#ffe9a8;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;animation:starfly var(--d,1s) ease-out forwards;animation-delay:var(--dl,0s)}
@keyframes starfly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(200deg)}}

/* fx 2 · 烟一下 */
.fx-poof{background:radial-gradient(ellipse at 50% 50%,#3a3330 0%,#120e0b 85%)}
.puff{position:absolute;left:50%;top:50%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#f1ebe3 0,#cfc5b9 55%,transparent 72%);opacity:0;animation:puff var(--d,1.1s) ease-out forwards;animation-delay:var(--dl,0s);filter:blur(1px)}
@keyframes puff{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(2.2)}}

/* fx 3 · 实验室 */
.fx-lab{background:#0b1416;background-image:linear-gradient(rgba(120,220,210,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,220,210,.08) 1px,transparent 1px);background-size:28px 28px}
.fx-lab .fcard .face{box-shadow:0 0 0 1px rgba(140,240,220,.5),0 0 40px rgba(80,220,200,.35),0 30px 60px rgba(0,0,0,.6)}
.flash{position:absolute;inset:0;background:#e9fffb;opacity:0;pointer-events:none}
.fx-lab.go .flash{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
.bubble{position:absolute;bottom:-20px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;border:2px solid rgba(160,255,235,.85);background:rgba(160,255,235,.12);animation:rise var(--d,1.6s) ease-in forwards;animation-delay:var(--dl,0s);opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-760px) translateX(var(--dx))}}
.arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc path{fill:none;stroke:#bffaf0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #7ff5e0);stroke-dasharray:900;stroke-dashoffset:900;opacity:0}
.fx-lab.go .arc path{animation:arc .55s linear forwards}
.fx-lab.go .arc path:nth-child(2){animation-delay:.12s}.fx-lab.go .arc path:nth-child(3){animation-delay:.22s}
@keyframes arc{0%{opacity:1;stroke-dashoffset:900}60%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
.fx-lab .readout{position:absolute;left:18px;bottom:150px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#9ff0df;letter-spacing:.08em;line-height:1.7;opacity:.85}

/* fx 4 · 掀毯子 */
.fx-blanket{background:radial-gradient(ellipse at 50% 60%,#5a3c27 0%,#2a1a10 85%)}
.fx-blanket .fcard.flipped{transform:rotateX(-180deg)}
.fx-blanket .back{transform:rotateX(180deg)}
.fx-blanket .fcard .face{border-radius:26px}
.fx-blanket.go .face:not(.back){animation:cloth var(--flip,.7s) ease-in-out}
@keyframes cloth{0%,100%{transform:none}35%{transform:skewX(5deg) scaleY(1.05) translateY(-6px)}70%{transform:skewX(-4deg) scaleY(.97) translateY(4px)}}
.fuzz{position:absolute;left:var(--x);top:var(--y);width:6px;height:9px;border-radius:3px;background:#b98a5e;opacity:0;animation:fuzz var(--d,1.4s) ease-out forwards;animation-delay:var(--dl,0s)}
@keyframes fuzz{0%{opacity:0;transform:translateY(0) rotate(0)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),80px) rotate(160deg)}}

/* fx 5 · 镜子 */
.fx-mirror{background:radial-gradient(ellipse at 50% 45%,#2a2d33 0%,#0d0f12 85%)}
.fx-mirror .fcard .face{box-shadow:0 0 0 4px rgba(215,235,255,.85),0 0 0 7px rgba(215,235,255,.25),0 0 50px rgba(190,225,255,.55),0 30px 60px rgba(0,0,0,.6)}
.fx-mirror.go .fcard .face{animation:ledpulse var(--flip,.7s) ease-in-out}
@keyframes ledpulse{50%{box-shadow:0 0 0 6px #fff,0 0 0 12px rgba(215,235,255,.5),0 0 110px rgba(220,240,255,1),0 30px 60px rgba(0,0,0,.6)}}
.sweep{position:absolute;inset:0;overflow:hidden;border-radius:20px;pointer-events:none}
.sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55) 50%,transparent);transform:skewX(-18deg);opacity:0}
.fx-mirror.go .sweep::before{animation:sweep calc(var(--flip,.7s) * 1.4) ease-in-out}
@keyframes sweep{0%{left:-60%;opacity:0}20%{opacity:1}100%{left:130%;opacity:0}}
.fstage:not(.fx-mirror) .ring{display:none}
.ring{position:absolute;left:50%;top:50%;width:360px;height:360px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(200,230,255,.08),inset 0 0 80px rgba(200,230,255,.08);pointer-events:none}

/* ---------- B · share card B × 4/6/9 ---------- */
.share3{position:absolute;inset:0;background:#f3ebe0;overflow:hidden}
.share3 .big{position:absolute;left:0;right:0;top:0;height:var(--h,60%);overflow:hidden}
.share3 .big img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.share3 .big::after{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(to top,#f3ebe0,transparent)}
.share3 .tear{position:absolute;left:0;right:0;top:calc(var(--h,60%) - 48px);display:grid;gap:8px;padding:0 16px;justify-content:center}
.share3 .tear .t{opacity:0;animation:popin .45s cubic-bezier(.2,.9,.3,1.3) forwards;animation-delay:calc(.15s * var(--i,0))}
.share3 .tear .ps{position:static;padding:4px;border-radius:11px}
.share3 .tear .ps img{border-radius:8px}
.share3.c4 .tear{grid-template-columns:repeat(4,78px)}
.share3.c4 .tear .t:nth-child(odd) .ps{transform:rotate(-5deg) translateY(4px)}
.share3.c4 .tear .t:nth-child(even) .ps{transform:rotate(4deg) translateY(-4px)}

.share3.c9 .tear{grid-template-columns:repeat(3,88px);gap:8px}
.share3.c9 .tear .t:nth-child(3n+1) .ps{transform:rotate(-3deg)}
.share3.c9 .tear .t:nth-child(3n) .ps{transform:rotate(3deg)}
.share3 .brand{position:absolute;left:0;right:0;bottom:124px;text-align:center;font-family:var(--display);font-weight:700;font-size:20px;color:#6b4423;letter-spacing:.5px}
.share3 .count{position:absolute;right:18px;top:calc(var(--h,60%) - 86px);font-family:var(--hand);font-size:30px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);transform:rotate(-6deg)}

/* ---------- C · production artifacts ---------- */
.seq > *{opacity:0;animation:popin .45s ease-out forwards}
.tag{position:absolute;z-index:22;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;white-space:nowrap}

.igtext{position:absolute;z-index:21;font-family:var(--body);font-weight:700;font-size:20px;line-height:1.3;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.5)}

.pola{position:absolute;z-index:20;width:150px;background:#fff;padding:8px 8px 22px;box-shadow:0 14px 34px rgba(0,0,0,.45)}

.stylecard .sc-h{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;color:#9a7b5c}

.sticky{position:absolute;z-index:21;width:300px;background:#fff6b3;color:#3a2c14;padding:14px 16px;font-family:var(--hand);font-size:22px;line-height:1.3;box-shadow:0 12px 30px rgba(0,0,0,.3)}

.term{position:absolute;inset:0;background:#0f1412;color:#cfe9dc;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7;padding:230px 18px 0}
.term .ln{white-space:pre}.term .dim{color:#6f8a7d}.term .ok{color:#8ff0b6;margin-top:8px}
.prompt{position:absolute;left:26px;right:26px;top:160px;z-index:21;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;color:#d8c9b6}

       why:'这一组的开场：先让朋友看「AI 是怎么描述这张照片的」。一句话里出现毯子、瓷砖、LED 镜子，朋友对照原图就会笑。这是整条链路里最有「它看懂了」感觉的一行字。'},
      {id:'c2', title:'它挑的画风', sub:'照片 · 画风卡', dur:9000, time:'19h',
       form:'照片 + 贴纸', how:'原图压暗做底，画风卡做成一张纸片贴上去，一张贴纸从旁边冒出来对照。纸片上的文字用 Text 排。',
       widgets:['Text'], stickers:'Give me a second.',
       source:'<code>packs.plan.style</code>（画风卡原文）和 <code>packs.preset</code>（模型自动挑的画风）。没选画风时由模型在目录里挑，选择原文留在 <code>provenance.response.preset</code>。',
       why:'「它为你挑了这个画风」比「我选了这个画风」更像魔法。画风卡的四个短句就是贴纸长这样的原因，放在原图上，朋友一眼看出因果。demo 里的画风名是示意。'},
      {id:'c3', title:'起名', sub:'Create · 标题', dur:9000, time:'18h',
       form:'Create 模式', how:'深底，原图做成小拍立得放上方，标题用 Text 打出来，三张贴纸从下面接着冒出来。',
       widgets:['Text（Typewriter）'], stickers:'Give me a second. / Not happening. / What\'s going on?',
       source:'<code>packs.plan.title</code>，规划时和方案一起生成；语种不符时后端会修一次，修复记录在底稿 <code>params.titleRepair</code>。iOS 已展示为作品名。',
       why:'标题是这套 pack 唯一一句朋友本来就能看到的话，但没人知道它是 AI 起的。先照片、再标题、再贴纸，三步就是整个生成顺序。'},
      {id:'c4', title:'一张的设计', sub:'Create · 便签', dur:9000, time:'16h',
       form:'Create 模式', how:'一张贴纸放大居中，下面一张便签纸，三行：scene、expression、pose，一行一行出现。文字用 Text 排成手写体。',
       widgets:['Text'], stickers:'Not happening.',
       source:'<code>packs.plan.stickers[].scene / expression / pose</code>，还有 camera、costume、setting、prop、effects。每张贴纸一份，iOS 只读了 caption。',
       why:'这是「设计过程的思考」最接近的东西：模型在画之前为每张写的导演说明。挑 Not happening 是因为三行都和原图对得上：对着镜子、肩膀说不、毯子裹紧。'},
      {id:'c5', title:'六个词', sub:'Create · 索引', dur:9000, time:'14h',
       form:'Create 模式', how:'浅底，六张贴纸 3×2，每张下面只放它的索引词和 emoji，原图小拍立得贴在左上角。',
       widgets:['无'], stickers:'整套六张',
       source:'<code>plan.stickers[].meaning</code>（不超过 4 字的索引）、<code>emoji</code>、<code>keywords</code>；<code>sticker_tags</code> 表另有标签，<code>GET /v1/stickers?tag=</code> 可查。iOS 都没用。',
       why:'meaning 本来是给搜索用的，但它正好是每张贴纸的「两字剧透」。六个词排一起，朋友不用读英文台词也知道这套能用在什么时候。'},
      {id:'c6', title:'底稿', sub:'Create · 终端', dur:11000, time:'12h',
       form:'Create 模式（或录屏）', how:'做成终端画面：请求一行、模型回答的 JSON 一行行出来，最后一行 ✓，贴纸从右下角弹出。原图小拍立得在右上角。',
       widgets:['无'], stickers:'Give me a second.',
       source:'<code>provenance</code> 表 kind=plan：<code>prompt</code>（发给模型的完整元提示词）、<code>response</code>（模型原始 JSON，用户编辑前的原文）、<code>params.visionAttempts</code>。<code>GET /v1/packs/{id}/provenance?scope=pack</code>，所有者和团队读者可读。iOS 未接入。',
       why:'「做实验」那条的真实版本：后端真的留着模型的原话。给朋友看的是节选，几行就够，重点是最后那个 ✓ 和弹出来的贴纸。'},
      {id:'c7', title:'提示词 → 图', sub:'Create · 显影', dur:11000, time:'10h',
       form:'Create 模式', how:'深底，出图提示词一行行出现，台词那行用手写体放大；提示词走完，贴纸从模糊到清晰显影出来。',
       widgets:['Text'], stickers:'That means a lot.',
       source:'<code>provenance</code> kind=cut 的 <code>prompt</code>（<code>imagePrompt</code> 拼出的实际出图提示词）、<code>inputs[]</code>（照片与参考图）、<code>model</code>。<code>?stickerId=s4</code> 可只取这一张。',
       why:'这是「文字变成图」的直接证据。提示词里有毯子、镜子光、手写台词、透明背景，每个词都能在贴纸上找到。显影动画让图像是「从这些词里长出来」的。'},
      {id:'c8', title:'导演说明', sub:'Create · 动起来', dur:9000, time:'8h',
       form:'Create 模式（或 GIF）', how:'一张贴纸居中微微起伏，下面一句 motion 说明。有动画版的话直接放 GIF。',
       widgets:['Text'], stickers:"I'm staying right here.",
       source:'<code>plan.stickers[].motion</code>（动画导演说明，必填）；动画产物在 <code>stickers.animation{gif,video}</code>，视频提示词由 motion 生成。',
       why:'motion 是写给动画模型的一句话，但它读起来像一条舞台提示。贴纸本身不动也没关系，一句「the lump settles lower」就够朋友脑补。'},
      {id:'c9', title:'第二次才成', sub:'Create · 失败记录', dur:9000, time:'5h',
       form:'Create 模式', how:'黑底。第一次的产物带着灰格背景出现，闪两下、变灰、标 ✗；第二次的干净版本从下面弹出，标 ✓。',
       widgets:['无'], stickers:'Well, I did not expect that.',
       source:'透明背景校验失败的原件存为 <code>{sid}-rejected-background.bin</code>，并记一条 <code>provenance</code> kind=cut、<code>params.validation="rejected"</code>；规划的重试次数在 <code>params.visionAttempts</code>。',
       why:'失败记录是最有人味的产物：机器也会画歪。贴纸台词「Well, I did not expect that.」正好是对这件事的反应。demo 里的灰格原件是示意。'},
      {id:'c10', title:'分享卡 C', sub:'照片 · 链接', dur:8000, time:'1h',
       form:'照片（Cookmoji 分享卡 C）', how:'分享卡第三个方向：原图铺上方，标题和一句角色描述压在渐变上，三张贴纸在下，Cookmoji 字标，加 Link。',
       widgets:['Link 链接贴纸（cookmoji.app）'], stickers:'Give me a second. / That means a lot. / What\'s going on?',
       source:'<code>plan.title</code> + <code>plan.subject</code> + 贴纸。都在 <code>GET /v1/packs/{id}</code> 一次返回里，客户端渲染分享卡时不用多请求。',
       why:'和 A（左右并排）、B（上下压边）对照：C 多了标题和一句描述。字是 AI 写的，不用用户填，所以不违背「少用文字」。这是三个方向里唯一能解释「为什么是这套」的。'},
]},
  ];

  const stage = document.getElementById('stage');
  const bars = document.getElementById('bars');
  const list = document.getElementById('list');
  const detail = document.getElementById('detail');
  const tabs = document.getElementById('tabs');
  const lab = document.getElementById('lab');
  const timeEl = document.getElementById('time');
  const screen = document.getElementById('screen');
  const h1 = document.getElementById('h1'), lede = document.getElementById('lede');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let g=0, stories=groups[0].stories;
  let cur=-1, start=0, elapsed=0, raf=0, paused=false, holdTimer=0, holding=false;
  let timers=[];
  let labState=null;   // {n,speed,fx} override for the current flip story

  groups.forEach((grp,i)=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=grp.tab;
    b.addEventListener('click',()=>switchGroup(i));tabs.appendChild(b);
  });

  function switchGroup(i){
    g=i; stories=groups[i].stories; labState=null;
    [...tabs.children].forEach((b,k)=>b.setAttribute('aria-selected',k===i?'true':'false'));
    h1.textContent=groups[i].h1; lede.textContent=groups[i].lede;
    bars.innerHTML=''; list.innerHTML='';
    stories.forEach((s,k)=>{
      const b=document.createElement('div');b.className='bar';b.innerHTML='<i></i>';bars.appendChild(b);
      const btn=document.createElement('button');btn.type='button';btn.setAttribute('role','tab');
      btn.innerHTML='<span class="n">'+(k+1)+'</span><span class="lb">'+s.title+'<small>'+s.sub+'</small></span>';
      btn.addEventListener('click',()=>go(k));list.appendChild(btn);
    });
    lab.hidden = groups[i].key!=='A';
    go(0);
  }

  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  function later(fn,ms){timers.push(setTimeout(fn,ms));}

  function mount(i){
    clearTimers();
    stage.innerHTML='';
    const s=stories[i];
    const node=document.importNode(document.getElementById(s.id).content,true);
    const wrap=document.createElement('div');wrap.className='story active';wrap.appendChild(node);
    stage.appendChild(wrap);
    if(s.flip) runFlip(wrap, labState || s.flip);
    if(s.share) buildShare(wrap, s.share);
    wire(wrap);
  }

  // ----- A · flip -----
  function spawn(fx, type, cfg){
    const rnd=(a,b)=>a+Math.random()*(b-a);
    const frag=document.createDocumentFragment();
    if(type==='sparkle'){for(let k=0;k<26;k++){const e=document.createElement('i');e.className='star';const a=rnd(0,Math.PI*2),r=rnd(110,280);e.style.setProperty('--dx',Math.cos(a)*r+'px');e.style.setProperty('--dy',Math.sin(a)*r+'px');e.style.setProperty('--d',rnd(.7,1.3)+'s');e.style.setProperty('--dl',rnd(0,.25)+'s');e.style.width=e.style.height=rnd(8,18)+'px';frag.appendChild(e);}}
    if(type==='poof'){for(let k=0;k<14;k++){const e=document.createElement('i');e.className='puff';const a=rnd(0,Math.PI*2),r=rnd(40,170);e.style.setProperty('--dx',Math.cos(a)*r+'px');e.style.setProperty('--dy',Math.sin(a)*r+'px');e.style.setProperty('--d',rnd(.9,1.4)+'s');e.style.setProperty('--dl',rnd(0,.15)+'s');frag.appendChild(e);}}
    if(type==='lab'){for(let k=0;k<14;k++){const e=document.createElement('i');e.className='bubble';e.style.setProperty('--x',rnd(4,92)+'%');e.style.setProperty('--s',rnd(6,22)+'px');e.style.setProperty('--dx',rnd(-30,30)+'px');e.style.setProperty('--d',rnd(1.2,2)+'s');e.style.setProperty('--dl',rnd(0,.4)+'s');frag.appendChild(e);}}
    if(type==='blanket'){for(let k=0;k<22;k++){const e=document.createElement('i');e.className='fuzz';e.style.setProperty('--x',rnd(18,82)+'%');e.style.setProperty('--y',rnd(20,60)+'%');e.style.setProperty('--dx',rnd(-40,40)+'px');e.style.setProperty('--d',rnd(1,1.8)+'s');e.style.setProperty('--dl',rnd(0,.5)+'s');frag.appendChild(e);}}
    fx.appendChild(frag);
    later(()=>{fx.innerHTML='';},2200);
  }
  function runFlip(root, cfg){
    const st=root.querySelector('[data-flip]'), card=st.querySelector('.fcard'), grid=st.querySelector('.grid'), fx=st.querySelector('.fx');
    const sp=SPEED[cfg.speed];
    st.classList.add('n'+cfg.n,'sp-'+cfg.speed,'fx-'+cfg.fx);
    st.style.setProperty('--flip',sp.flip+'s');
    ORDER.slice(0,cfg.n).forEach(k=>{const im=document.createElement('img');im.src='assets/'+k+'.jpg';im.alt=S[k];grid.appendChild(im);});
    if(cfg.fx==='lab'){st.querySelector('.readout').innerHTML='SAMPLE  IMG_2515<br>INPUT   1 photo<br>OUTPUT  '+cfg.n+' sticker'+(cfg.n>1?'s':'')+'<br>CHARGE  '+Math.round(sp.flip*1000)+' ms';}
    const flipMs=sp.flip*1000, holdMs=sp.hold*1000;
    let flipped=false;
    function doFlip(){
      st.classList.add('go'); spawn(fx,cfg.fx,cfg);
      flipped=!flipped; card.classList.toggle('flipped',flipped);
      later(()=>st.classList.remove('go'), flipMs+150);
      later(doFlip, flipMs+holdMs);
    }
    later(doFlip, holdMs*0.6);
  }

  // ----- B · share card B × n -----
  function buildShare(root, cfg){
    const sh=root.querySelector('[data-share]'), tear=sh.querySelector('.tear');
    sh.classList.add('c'+cfg.n);
    sh.style.setProperty('--h',{4:'62%',6:'56%',9:'46%'}[cfg.n]);
    ORDER.slice(0,cfg.n).forEach((k,i)=>{const t=document.createElement('div');t.className='t';t.style.setProperty('--i',i);t.innerHTML='<div class="ps"><img src="assets/'+k+'.jpg" alt="'+S[k]+'"></div>';tear.appendChild(t);});
  }

  function wire(root){
    const wp=root.querySelector('[data-wipe]');
    if(wp){const set=e=>{const r=wp.getBoundingClientRect();const x=Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100));wp.style.setProperty('--x',x+'%');};
      wp.addEventListener('pointerdown',e=>{e.stopPropagation();wp.classList.remove('auto');wp.setPointerCapture(e.pointerId);set(e);setPaused(true);});
      wp.addEventListener('pointermove',e=>{if(e.buttons)set(e);});
      wp.addEventListener('pointerup',e=>{setPaused(false);});}
    const tp=root.querySelector('[data-typer]');
    if(tp){const txt=tp.dataset.typer;tp.textContent='';let k=0;const step=()=>{tp.textContent=txt.slice(0,++k);if(k<txt.length)later(step,28+Math.random()*40);};later(step,400);}
    root.querySelectorAll('[data-seq]').forEach(el=>{el.querySelectorAll(':scope > *').forEach((c,i)=>{c.style.animationDelay=(parseFloat(el.dataset.seq||'0.6')*i+0.3)+'s';});});
    root.querySelectorAll('.ig, .ps, .pin, .cut, .mini, .fcard').forEach(el=>el.addEventListener('pointerdown',e=>e.stopPropagation()));
  }

  function go(i){
    if(i<0)i=0; if(i>=stories.length)i=0;
    if(i!==cur) labState=null;
    cur=i; elapsed=0; start=performance.now(); paused=false; screen.classList.remove('paused');
    mount(i);
    timeEl.textContent=stories[i].time;
    document.querySelector('.hdr .av').classList.toggle('photo', !!stories[i].avatarPhoto);
    [...bars.children].forEach((b,k)=>{b.classList.toggle('done',k<i);b.querySelector('i').style.width=k<i?'100%':'0';});
    [...list.children].forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
    renderDetail(i);
    renderLab();
    cancelAnimationFrame(raf); tick();
  }
  function tick(){
    const s=stories[cur];
    if(!paused){elapsed=performance.now()-start;}
    const p=Math.min(1,elapsed/s.dur);
    bars.children[cur].querySelector('i').style.width=(p*100)+'%';
    if(p>=1){ if(cur<stories.length-1) go(cur+1); else { paused=true; screen.classList.add('paused'); } return; }
    raf=requestAnimationFrame(tick);
  }
  function setPaused(v){ if(v===paused)return; paused=v; screen.classList.toggle('paused',v); if(!v){start=performance.now()-elapsed;} }

  function renderDetail(i){
    const s=stories[i];
    detail.innerHTML=
      '<div class="eyebrow">'+groups[g].tab.split(' · ')[0]+' · Story '+(i+1)+' / '+stories.length+'</div>'+
      '<h2>'+s.title+'</h2>'+
      '<dl>'+
      '<dt>发布形式</dt><dd><span class="chip form">'+s.form+'</span></dd>'+
      '<dt>怎么发</dt><dd>'+s.how+'</dd>'+
      '<dt>小组件</dt><dd><span class="chips">'+s.widgets.map(w=>'<span class="chip">'+w+'</span>').join('')+'</span></dd>'+
      '<dt>用的贴纸</dt><dd>'+s.stickers+'</dd>'+
      (s.source?'<dt>后端来源</dt><dd>'+s.source+'</dd>':'')+
      '</dl>'+
      '<div class="why">'+s.why+'</div>';
  }

  // ----- lab panel (group A only) -----
  function renderLab(){
    const s=stories[cur]; if(!s||!s.flip){return;}
    const cfg=labState||s.flip;
    const row=(label,key,opts)=>'<div class="row"><span>'+label+'</span><div class="opts">'+opts.map(([v,t])=>'<button type="button" data-k="'+key+'" data-v="'+v+'" aria-pressed="'+(String(cfg[key])===String(v))+'">'+t+'</button>').join('')+'</div></div>';
    lab.innerHTML='<h3>实验台 · 当前这条</h3>'+
      row('速度','speed',[['slow','慢 1.1s'],['mid','中 0.7s'],['fast','快 0.4s']])+
      row('张数','n',[[1,'1 张'],[4,'4 张'],[6,'6 张'],[9,'9 张']])+
      row('特效','fx',Object.entries(FX))+
      '<div class="hintline">改任意一项，当前这条立即按新组合重放。1 张就是第二组第 4 条的原样；「掀毯子」会把翻转轴改成上沿。</div>';
    lab.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      const c=Object.assign({},cfg); const k=b.dataset.k; c[k]= k==='n'?Number(b.dataset.v):b.dataset.v; labState=c;
      elapsed=0; start=performance.now(); paused=false; screen.classList.remove('paused'); mount(cur); renderLab();
    }));
  }

  // tap / hold
  function bindZone(el,dir){
    el.addEventListener('pointerdown',e=>{holding=false;holdTimer=setTimeout(()=>{holding=true;setPaused(true);},180);});
    el.addEventListener('pointerup',e=>{clearTimeout(holdTimer);if(holding){setPaused(false);holding=false;return;} go(cur+dir);});
    el.addEventListener('pointerleave',()=>{clearTimeout(holdTimer);if(holding){setPaused(false);holding=false;}});
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
  bindZone(document.getElementById('tapL'),-1);
  bindZone(document.getElementById('tapR'),1);
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')go(cur+1); else if(e.key==='ArrowLeft')go(cur-1);
    else if(e.key===' '){e.preventDefault();setPaused(!paused);}
  });
  document.querySelector('.hdr .x').addEventListener('click',()=>go(0));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) setPaused(true); });
  if(reduced){ groups.forEach(gr=>gr.stories.forEach(s=>s.dur=Math.max(s.dur,12000))); }

  const fit=document.getElementById('fit'), phone=document.getElementById('phone');
  function fitPhone(){const k=Math.min(1,fit.clientWidth/393);phone.style.transform='scale('+k+')';fit.style.height=(852*k)+'px';}
  new ResizeObserver(fitPhone).observe(fit); fitPhone();

  const fromHash=()=>{const m=/^#([abc])(\d+)$/.exec(location.hash||'');if(!m)return false;switchGroup('abc'.indexOf(m[1]));go(Number(m[2])-1);return true;};
  window.addEventListener('hashchange',fromHash);
  const boot=(data)=>{
    if(fromHash())return;
    switchGroup(Number.isInteger(data&&data.g)?data.g:0); if(Number.isInteger(data&&data.cur)) go(data.cur);};
  if(window.claude&&window.claude.hot){ window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({g,cur})); window.claude.hot.ready?window.claude.hot.ready(boot):boot(window.claude.hot.data||{}); }
  else boot({});
})();
</script>
